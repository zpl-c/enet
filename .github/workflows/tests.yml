name: tests
on:
  push:
    tags-ignore:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - master
      - review/**
    paths:
      - 'include/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'include/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - '.github/workflows/tests.yml'

jobs:
  prep:
    name: Notify about testing
    runs-on: ubuntu-latest
    steps:
      - uses: inlife/actiord-action@v1
        with:
          url: ${{ secrets.ACTIORD_URL }}
          discord_token: ${{ secrets.DISCORD_TOKEN }}
          discord_channel: ${{ secrets.DISCORD_CHANNEL }}
          icon: https://avatars1.githubusercontent.com/u/26773913?s=200&v=4
          state: started

  build-win:
    name: Test Windows
    runs-on: windows-latest
    needs: [prep]
    steps:
      - uses: actions/checkout@v1
      - name: Run cmake generator
        run: cmake -B build -DENET_TEST=1
      - name: Run Windows build
        run: cmake --build build
      - name: Run unit tests
        run: cd build ; .\Debug\enet_test.exe
      - name: Run unit tests with extra peers
        run: cd build ; .\Debug\enet_test_extra_peers.exe
      - name: Run unit tests with IPv4-only mode
        run: cd build ; .\Debug\enet_test_ipv4_only.exe
      - name: Run the unit test suite
        run: cd build ; .\Debug\enet_test_unit.exe

  build-win-ipv4:
    name: Test Windows (IPv4-only)
    runs-on: windows-latest
    needs: [prep]
    steps:
      - uses: actions/checkout@v1
      - name: Run cmake generator with IPv4-only
        run: cmake -B build_ipv4 -DENET_TEST=1 -DENET_IPV4_ONLY=ON
      - name: Run Windows build (IPv4-only)
        run: cmake --build build_ipv4
      - name: Run unit tests (IPv4-only)
        run: cd build_ipv4 ; .\Debug\enet_test.exe
      - name: Run the unit test suite (IPv4-only)
        run: cd build_ipv4 ; .\Debug\enet_test_unit.exe

  build-win-shared:
    name: Test Windows (shared)
    runs-on: windows-latest
    needs: [prep]
    steps:
      - uses: actions/checkout@v1
      - name: Run cmake generator with the shared library
        run: cmake -B build_shared -DENET_TEST=1 -DENET_SHARED=1
      - name: Run Windows build (shared)
        run: cmake --build build_shared
      - name: Run unit tests (shared)
        run: cd build_shared ; .\Debug\enet_test.exe
      - name: Link against the shared library through its import library
        run: cd build_shared ; .\Debug\enet_test_shared.exe

  build-lin:
    name: Test Linux
    runs-on: ubuntu-latest
    needs: [prep]
    steps:
      - uses: actions/checkout@v1
      - name: Run cmake generator
        run: cmake -B build -DENET_TEST=1
      - name: Run build on Linux
        run: cmake --build build
      - name: Test build on Linux
        run: build/enet_test
      - name: Test build on Linux with extra peers
        run: build/enet_test_extra_peers
      - name: Test build on Linux with IPv4-only mode
        run: build/enet_test_ipv4_only
      - name: Run the unit test suite on Linux
        run: build/enet_test_unit

  build-lin-ipv4:
    name: Test Linux (IPv4-only)
    runs-on: ubuntu-latest
    needs: [prep]
    steps:
      - uses: actions/checkout@v1
      - name: Run cmake generator with IPv4-only
        run: cmake -B build_ipv4 -DENET_TEST=1 -DENET_IPV4_ONLY=ON
      - name: Run build on Linux (IPv4-only)
        run: cmake --build build_ipv4
      - name: Test build on Linux (IPv4-only)
        run: build_ipv4/enet_test
      - name: Run the unit test suite on Linux (IPv4-only)
        run: build_ipv4/enet_test_unit

  build-mac:
    name: Test macOS
    runs-on: macOS-latest
    needs: [prep]
    steps:
      - uses: actions/checkout@v1
      - name: Run cmake generator
        run: cmake -B build -DENET_TEST=1
      - name: Run build on macOS
        run: cmake --build build
      - name: Test build on macOS
        run: build/enet_test
      - name: Test build on macOS with extra peers
        run: build/enet_test_extra_peers
      - name: Run the unit test suite on macOS
        run: build/enet_test_unit

  build-ios:
    name: Build iOS
    runs-on: macOS-latest
    needs: [prep]
    steps:
      - uses: actions/checkout@v1
      # The tests cannot run on a phone here, but the header has to compile for one: it is a different platform of
      # the same Apple SDK, and macOS-only code reaching iOS is not visible in any other job.
      - name: Compile the header for iOS
        run: |
          printf '#define ENET_IMPLEMENTATION\n#include "enet.h"\nint main(void) { return 0; }\n' > ios_build.c
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 -Iinclude -Werror -c ios_build.c -o ios_build.o
      - name: Compile the header for the iOS simulator
        run: |
          xcrun --sdk iphonesimulator clang -arch x86_64 -mios-simulator-version-min=13.0 -Iinclude -Werror -c ios_build.c -o ios_build_sim.o

  done:
    name: Notify about status
    runs-on: ubuntu-latest
    needs: [build-mac, build-ios, build-lin, build-win, build-lin-ipv4, build-win-ipv4, build-win-shared]
    if: "always()"
    steps:
      - uses: inlife/actiord-action@v1
        if: ${{ contains(needs.build-mac.result, 'success') && contains(needs.build-ios.result, 'success') && contains(needs.build-lin.result, 'success') && contains(needs.build-win.result, 'success') && contains(needs.build-lin-ipv4.result, 'success') && contains(needs.build-win-ipv4.result, 'success') && contains(needs.build-win-shared.result, 'success') }}
        with:
          url: ${{ secrets.ACTIORD_URL }}
          icon: https://avatars1.githubusercontent.com/u/26773913?s=200&v=4
          state: succeeded

      - uses: inlife/actiord-action@v1
        if: ${{ !(contains(needs.build-mac.result, 'success') && contains(needs.build-ios.result, 'success') && contains(needs.build-lin.result, 'success') && contains(needs.build-win.result, 'success') && contains(needs.build-lin-ipv4.result, 'success') && contains(needs.build-win-ipv4.result, 'success') && contains(needs.build-win-shared.result, 'success')) }}
        with:
          url: ${{ secrets.ACTIORD_URL }}
          discord_token: ${{ secrets.DISCORD_TOKEN }}
          discord_channel: ${{ secrets.DISCORD_CHANNEL }}
          icon: https://avatars1.githubusercontent.com/u/26773913?s=200&v=4
          state: failed
